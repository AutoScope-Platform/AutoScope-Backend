# Render Blueprint: staging environment (API + worker + Redis).
# The database and file storage are Neon (PostGIS enabled; Neon Object Storage for uploads), so
# their settings are filled in the dashboard, not here. Create the Neon project in Frankfurt
# (aws-eu-central-1): object storage only exists in a few regions, and the services below run
# in Frankfurt too, close to the database and to Nigeria.
# Fill every `sync: false` value in the Render dashboard; see docs/INTEGRATIONS.md.
services:
  - type: web
    name: autoscope-api
    runtime: docker
    region: frankfurt
    plan: starter            # the free plan sleeps after 15 minutes idle
    healthCheckPath: /health
    envVars: &shared
      - { key: ENV, value: staging }
      - { key: RUN_MIGRATIONS, value: "true" }            # migrate at start (single instance)
      - { key: DATABASE_URL, sync: false }            # Neon pooled connection string
      - { key: MIGRATION_DATABASE_URL, sync: false }  # Neon DIRECT (non-pooled) string, used by Alembic
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, value: "https://autoscope-admin.netlify.app" }
      - { key: REDIS_URL, fromService: { type: redis, name: autoscope-redis, property: connectionString } }
      # Push/SMS/e-mail go through the worker below; live events fan out through Redis.
      - { key: TASK_QUEUE, value: celery }
      - { key: SMS_DRIVER, value: mock }
      - { key: EMAIL_DRIVER, value: mock }
      - { key: PUSH_DRIVER, value: mock }
      - { key: PAYMENT_DRIVER, value: mock }
      - { key: KYC_DRIVER, value: mock }
      - { key: SOCIAL_DRIVER, value: mock }           # "live" once the client ids below are set
      - { key: GOOGLE_CLIENT_IDS, sync: false }       # iOS, Android and web OAuth client ids
      - { key: APPLE_CLIENT_IDS, sync: false }        # iOS bundle id
      # Render's disk is wiped on every deploy, so uploaded photos and KYC files must live in
      # S3-compatible storage even on staging: Neon Object Storage (or a Cloudflare R2 bucket).
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: S3_ENDPOINT_URL, sync: false }         # Neon: the branch's storage endpoint (see docs/INTEGRATIONS.md)
      - { key: S3_REGION, value: eu-central-1 }       # Neon Frankfurt; "auto" for R2
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }        # Neon: the credential's token_id (nak_...)
      - { key: S3_SECRET_ACCESS_KEY, sync: false }    # Neon: s3_secret_access_key (nsk_...)

  - type: worker
    name: autoscope-worker
    runtime: docker
    region: frankfurt
    plan: starter            # background workers have no free plan
    dockerCommand: celery -A app.worker.celery_app worker --beat --loglevel=info
    envVars: *shared

  - type: redis
    name: autoscope-redis
    region: frankfurt
    ipAllowList: []   # internal only
    plan: free
