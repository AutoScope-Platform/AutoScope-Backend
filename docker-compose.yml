# Local services for development: PostgreSQL with PostGIS, and Redis.
# `docker compose up -d` then `make migrate` and `make run`.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: autoscope
      POSTGRES_PASSWORD: autoscope
      POSTGRES_DB: autoscope_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
