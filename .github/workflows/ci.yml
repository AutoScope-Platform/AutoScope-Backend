name: CI
on:
  push: { branches: [main, develop] }
  pull_request:
  workflow_call:  # the Azure deploy runs the same checks first

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: autoscope, POSTGRES_PASSWORD: autoscope, POSTGRES_DB: autoscope_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoscope" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://autoscope:autoscope@127.0.0.1:5432/autoscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations && uv run ruff format --check app tests migrations
      - run: uv run pytest -q
      # The migration must build the same schema the models describe.
      - name: Migrations match models
        env: { DATABASE_URL: "postgresql://autoscope:autoscope@127.0.0.1:5432/autoscope_test" }
        # Start from an empty schema. (The old one-liner kept no reference to the context
        # manager from `e.begin()`, so the connection was closed before it was used.)
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine("postgresql+psycopg://autoscope:autoscope@127.0.0.1:5432/autoscope_test")
          with engine.begin() as conn:
              conn.execute(text("DROP SCHEMA public CASCADE"))
              conn.execute(text("CREATE SCHEMA public"))
          PY
          uv run alembic upgrade head
          uv run alembic check
